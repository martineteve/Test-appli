<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Terrain">
<meta name="theme-color" content="#0f0f0f">
<title>Terrain</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg: #0f0f0f;
    --bg2: #1a1a1a;
    --bg3: #252525;
    --border: #2e2e2e;
    --text: #f0ede8;
    --text2: #8a8680;
    --accent: #c8a96e;
    --accent2: #a08050;
    --red: #e05555;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    height: 100dvh;
    overflow: hidden;
    user-select: none;
  }

  /* ── SCREENS ── */
  .screen { display: none; flex-direction: column; height: 100dvh; }
  .screen.active { display: flex; }

  /* ── TOPBAR ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(var(--safe-top) + 14px) 20px 14px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    min-height: calc(var(--safe-top) + 52px);
  }
  .topbar-title { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  .topbar-sub { font-size: 13px; color: var(--text2); margin-top: 1px; }
  .topbar-btn {
    background: none; border: none; color: var(--accent);
    font-size: 15px; font-weight: 500; cursor: pointer; padding: 6px 0;
    display: flex; align-items: center; gap: 6px;
  }
  .topbar-btn svg { width: 18px; height: 18px; }
  .topbar-btn.icon-only { padding: 6px; }

  /* ── LIST ── */
  .scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  
  .section-header {
    font-size: 11px; font-weight: 600; letter-spacing: 0.8px;
    color: var(--text2); text-transform: uppercase;
    padding: 20px 20px 8px;
  }

  .folder-item, .sheet-item {
    display: flex; align-items: center;
    padding: 14px 20px; gap: 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.1s;
    position: relative;
  }
  .folder-item:active, .sheet-item:active { background: var(--bg2); }

  .folder-icon {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--bg3); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 18px;
  }
  .folder-info { flex: 1; min-width: 0; }
  .folder-name { font-size: 16px; font-weight: 500; }
  .folder-meta { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .folder-chevron { color: var(--text2); font-size: 13px; }

  .sheet-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0; margin: 0 5px;
  }
  .sheet-info { flex: 1; min-width: 0; }
  .sheet-title { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-preview { font-size: 13px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-date { font-size: 12px; color: var(--text2); flex-shrink: 0; }

  /* ── FAB ── */
  .fab {
    position: fixed; right: 22px;
    bottom: calc(var(--safe-bottom) + 22px);
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(200,169,110,0.4);
    transition: transform 0.15s, box-shadow 0.15s; z-index: 10;
  }
  .fab:active { transform: scale(0.93); box-shadow: 0 2px 10px rgba(200,169,110,0.3); }
  .fab svg { color: #0f0f0f; }

  /* ── NOTE EDITOR ── */
  #screen-editor { position: relative; }

  .editor-topbar {
    display: flex; align-items: center;
    padding: calc(var(--safe-top) + 12px) 16px 12px;
    background: var(--bg); border-bottom: 1px solid var(--border);
    flex-shrink: 0; gap: 10px;
  }
  .editor-back {
    background: none; border: none; color: var(--accent);
    font-size: 15px; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; gap: 4px; padding: 4px 0; flex-shrink: 0;
  }
  .editor-title-input {
    flex: 1; background: none; border: none; color: var(--text);
    font-size: 17px; font-weight: 600; outline: none;
    font-family: inherit; text-align: center;
  }
  .editor-title-input::placeholder { color: var(--text2); }
  .editor-save {
    background: none; border: none; color: var(--accent);
    font-size: 15px; font-weight: 600; cursor: pointer; padding: 4px 0; flex-shrink: 0;
  }

  .editor-meta {
    padding: 10px 18px; font-size: 12px; color: var(--text2);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }

  .content-area {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 12px 0; scroll-behavior: smooth;
  }

  /* blocks */
  .block {
    padding: 6px 18px; position: relative;
  }
  .block-text {
    font-size: 16px; line-height: 1.6; color: var(--text);
    white-space: pre-wrap; word-break: break-word;
    min-height: 24px;
  }
  .block-text.empty::before { content: attr(data-placeholder); color: var(--text2); }
  .block-text:focus { outline: none; }

  /* ── PHOTO GRID ── */
  .block-photo-series {
    margin: 4px 18px; position: relative;
  }
  .photo-series-label {
    font-size: 11px; color: var(--text2); margin-bottom: 6px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .photo-series-delete {
    background: none; border: none; color: var(--red); font-size: 12px;
    cursor: pointer; padding: 0;
  }
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
  }
  .photo-thumb {
    aspect-ratio: 1; border-radius: 6px; overflow: hidden;
    cursor: pointer; position: relative; background: var(--bg3);
  }
  .photo-thumb img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: opacity 0.15s;
  }
  .photo-thumb:active img { opacity: 0.7; }
  .photo-thumb-count {
    position: absolute; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: white; border-radius: 6px;
  }

  /* single drawing block */
  .block-media {
    position: relative; border-radius: 10px; overflow: hidden;
    background: var(--bg3); margin: 4px 18px;
  }
  .block-media img, .block-media canvas { width: 100%; display: block; border-radius: 10px; }
  .block-media-label {
    position: absolute; top: 8px; left: 8px;
    background: rgba(0,0,0,0.6); color: var(--text); font-size: 11px;
    padding: 3px 8px; border-radius: 20px; backdrop-filter: blur(4px);
  }
  .block-delete {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,0.6); border: none; color: var(--red);
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px); font-size: 14px;
  }

  /* ── LIGHTBOX ── */
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.96); flex-direction: column;
    align-items: center; justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox-topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(var(--safe-top) + 12px) 18px 12px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    z-index: 1;
  }
  .lightbox-counter { font-size: 15px; font-weight: 500; color: white; }
  .lightbox-close {
    background: rgba(255,255,255,0.15); border: none; color: white;
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .lightbox-download {
    background: rgba(255,255,255,0.15); border: none; color: white;
    padding: 6px 14px; border-radius: 20px; cursor: pointer;
    font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px;
  }
  .lightbox-img-wrap {
    width: 100%; flex: 1; display: flex; align-items: center; justify-content: center;
    overflow: hidden; touch-action: pan-y pinch-zoom;
  }
  .lightbox-img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    user-select: none; -webkit-user-drag: none;
  }
  .lightbox-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.12); border: none; color: white;
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    backdrop-filter: blur(4px);
  }
  .lightbox-nav.prev { left: 12px; }
  .lightbox-nav.next { right: 12px; }
  .lightbox-nav:disabled { opacity: 0.2; }
  .lightbox-dots {
    position: absolute; bottom: calc(var(--safe-bottom) + 20px);
    display: flex; gap: 6px; align-items: center;
  }
  .lightbox-dot {
    width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3);
    transition: background 0.2s, transform 0.2s;
  }
  .lightbox-dot.active { background: white; transform: scale(1.3); }

  .block-audio {
    background: var(--bg3); border-radius: 10px;
    margin: 4px 18px; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .audio-play {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: transform 0.1s;
  }
  .audio-play:active { transform: scale(0.9); }
  .audio-info { flex: 1; min-width: 0; }
  .audio-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .audio-dur { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .audio-waveform {
    height: 24px; display: flex; align-items: center; gap: 2px;
    margin-top: 6px;
  }
  .audio-bar {
    width: 2px; border-radius: 2px; background: var(--accent2);
    transition: background 0.2s;
  }
  .audio-bar.played { background: var(--accent); }

  /* ── TOOLBAR ── */
  .editor-toolbar {
    display: flex; align-items: center;
    padding: 8px 16px; padding-bottom: calc(8px + var(--safe-bottom));
    background: var(--bg2); border-top: 1px solid var(--border);
    gap: 8px; flex-shrink: 0;
  }
  .editor-textarea {
    flex: 1; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 20px; color: var(--text); font-size: 15px;
    padding: 8px 14px; outline: none; font-family: inherit;
    line-height: 1.4; resize: none; max-height: 100px; min-height: 36px;
    overflow-y: auto;
  }
  .editor-textarea::placeholder { color: var(--text2); }
  
  .tool-btn {
    background: var(--bg3); border: 1px solid var(--border);
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.1s, transform 0.1s; flex-shrink: 0;
    color: var(--text2);
  }
  .tool-btn:active { transform: scale(0.9); background: var(--border); }
  .tool-btn.recording { background: var(--red); border-color: var(--red); color: white; animation: pulse 1s infinite; }
  .send-btn {
    background: var(--accent); border: none;
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: transform 0.1s;
  }
  .send-btn:active { transform: scale(0.9); }
  .send-btn:disabled { opacity: 0.4; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(224,85,85,0.4); }
    50% { box-shadow: 0 0 0 8px rgba(224,85,85,0); }
  }

  /* ── DRAWING MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.85); flex-direction: column;
    align-items: center; justify-content: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .draw-sheet {
    width: 100%; background: var(--bg2);
    border-radius: 20px 20px 0 0;
    display: flex; flex-direction: column;
    max-height: 85dvh;
  }
  .draw-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .draw-title { font-size: 15px; font-weight: 600; }
  .draw-header-btn {
    background: none; border: none; color: var(--accent);
    font-size: 15px; font-weight: 500; cursor: pointer;
  }
  .draw-tools {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px; border-bottom: 1px solid var(--border);
    flex-shrink: 0; overflow-x: auto;
  }
  .color-dot {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: transform 0.1s;
    flex-shrink: 0;
  }
  .color-dot.active { border-color: white; transform: scale(1.15); }
  .size-btn {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 4px 10px;
    font-size: 13px; cursor: pointer; flex-shrink: 0;
  }
  .size-btn.active { background: var(--accent); border-color: var(--accent); color: #0f0f0f; font-weight: 600; }
  .draw-canvas-wrap { flex: 1; overflow: hidden; position: relative; }
  #draw-canvas { display: block; touch-action: none; cursor: crosshair; width: 100%; }
  .draw-erase-btn {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text2);
    border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer; flex-shrink: 0;
  }
  .draw-erase-btn.active { background: var(--red); border-color: var(--red); color: white; }

  /* ── MODAL NEW FOLDER / SHEET ── */
  .modal-sheet {
    width: 100%; background: var(--bg2);
    border-radius: 20px 20px 0 0;
    padding: 20px 20px calc(20px + var(--safe-bottom));
  }
  .modal-sheet h3 { font-size: 17px; font-weight: 600; margin-bottom: 16px; text-align: center; }
  .modal-input {
    width: 100%; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text); font-size: 16px;
    padding: 12px 16px; outline: none; font-family: inherit; margin-bottom: 12px;
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-btn {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 8px;
  }
  .modal-btn.primary { background: var(--accent); color: #0f0f0f; }
  .modal-btn.cancel { background: var(--bg3); color: var(--text2); }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; flex: 1; gap: 12px; padding: 40px;
    text-align: center;
  }
  .empty-icon { font-size: 48px; opacity: 0.3; }
  .empty-text { font-size: 15px; color: var(--text2); line-height: 1.5; }

  /* ── SWIPE DELETE ── */
  .swipe-wrapper { position: relative; overflow: hidden; }
  .swipe-delete-bg {
    position: absolute; right: 0; top: 0; bottom: 0;
    background: var(--red); display: flex; align-items: center;
    padding: 0 20px; font-size: 13px; color: white; font-weight: 500;
    pointer-events: none;
  }
  .swipe-inner { transition: transform 0.2s; background: var(--bg); }

  /* ── RECORDING INDICATOR ── */
  .rec-indicator {
    display: none; position: fixed; top: calc(var(--safe-top) + 8px); left: 50%;
    transform: translateX(-50%); background: var(--red);
    color: white; font-size: 12px; font-weight: 600;
    padding: 4px 14px; border-radius: 20px; z-index: 200;
    align-items: center; gap: 6px;
  }
  .rec-indicator.visible { display: flex; }
  .rec-dot { width: 7px; height: 7px; border-radius: 50%; background: white; animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* camera input hidden */
  #camera-input, #gallery-input { display: none; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>

<!-- Recording indicator -->
<div class="rec-indicator" id="rec-indicator">
  <div class="rec-dot"></div>
  <span id="rec-time">0:00</span>
</div>

<!-- Hidden inputs -->
<input type="file" id="camera-input" accept="image/*" capture="environment">
<input type="file" id="gallery-input" accept="image/*" multiple>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-topbar">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <span class="lightbox-counter" id="lb-counter"></span>
    <button class="lightbox-download" onclick="downloadCurrentPhoto()">
      <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      Exporter
    </button>
  </div>
  <div class="lightbox-img-wrap">
    <img class="lightbox-img" id="lb-img" src="" alt="">
  </div>
  <button class="lightbox-nav prev" id="lb-prev" onclick="lbNav(-1)">‹</button>
  <button class="lightbox-nav next" id="lb-next" onclick="lbNav(1)">›</button>
  <div class="lightbox-dots" id="lb-dots"></div>
</div>

<!-- ══ SCREEN: FOLDERS ══ -->
<div class="screen active" id="screen-folders">
  <div class="topbar">
    <div>
      <div class="topbar-title">Terrain</div>
      <div class="topbar-sub" id="folders-meta">Chargement…</div>
    </div>
    <button class="topbar-btn" onclick="openNewFolderModal()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Dossier
    </button>
  </div>
  <div class="scroll-area" id="folders-list"></div>
  <div style="padding:16px;text-align:center;font-size:11px;color:var(--border)">v0.5</div>

<!-- ══ SCREEN: SHEETS ══ -->
<div class="screen" id="screen-sheets">
  <div class="topbar">
    <button class="topbar-btn" onclick="goBack('folders')">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" style="width:16px;height:16px"><path d="M15 18l-6-6 6-6"/></svg>
      Retour
    </button>
    <div style="text-align:center">
      <div class="topbar-title" id="sheets-folder-name"></div>
      <div class="topbar-sub" id="sheets-meta"></div>
    </div>
    <button class="topbar-btn" onclick="openNewSheetModal()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Terrain
    </button>
  </div>
  <div class="scroll-area" id="sheets-list"></div>
</div>

<!-- ══ SCREEN: EDITOR ══ -->
<div class="screen" id="screen-editor">
  <div class="editor-topbar">
    <button class="editor-back" onclick="goBack('sheets')">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" style="width:16px;height:16px"><path d="M15 18l-6-6 6-6"/></svg>
      Retour
    </button>
    <input class="editor-title-input" id="editor-title" placeholder="Nom du terrain" autocomplete="off" spellcheck="false">
    <button class="editor-save" onclick="saveCurrentSheet()">OK</button>
  </div>
  <div class="editor-meta" id="editor-meta"></div>
  <div class="content-area" id="content-area"></div>
  <div class="editor-toolbar">
    <button class="tool-btn" id="mic-btn" onclick="toggleRecording()" title="Enregistrer">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0014 0M12 19v3M8 22h8"/>
      </svg>
    </button>
    <button class="tool-btn" id="photo-btn" onclick="togglePhotoMenu()" title="Photo">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>
    <!-- Photo menu -->
    <div id="photo-menu" style="display:none;position:fixed;bottom:calc(var(--safe-bottom) + 70px);left:16px;
      background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;z-index:150;min-width:180px;
      box-shadow:0 8px 24px rgba(0,0,0,0.5);">
      <button onclick="startCameraSession()" style="display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;
        background:none;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:15px;
        font-family:inherit;cursor:pointer;text-align:left;">
        <span>📷</span> Appareil photo
      </button>
      <button onclick="openGallery()" style="display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;

  <div class="modal-sheet">

<script>
// ══════════════════════════════════════
// DATA LAYER
// ══════════════════════════════════════
const DB_KEY = 'terrain_db_v2';
let _memDB = null; // in-memory fallback when localStorage unavailable

function isStorageAvailable() {
  try { localStorage.setItem('_test', '1'); localStorage.removeItem('_test'); return true; }
  catch { return false; }
}
const USE_STORAGE = isStorageAvailable();

function loadDB() {
  try {
    if (USE_STORAGE) {
      const raw = localStorage.getItem(DB_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      return parsed && Array.isArray(parsed.folders) ? parsed : { folders: [] };
    }
    return _memDB || { folders: [] };
  } catch { return _memDB || { folders: [] }; }
}
function saveDB(db) {
  _memDB = db;
  try { if (USE_STORAGE) localStorage.setItem(DB_KEY, JSON.stringify(db)); }
  catch(e) { console.warn('Storage unavailable', e); }
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function fmtDate(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return "À l'instant";
  if (diff < 3600) return Math.floor(diff/60) + " min";
  if (diff < 86400) return Math.floor(diff/3600) + "h";
  return d.toLocaleDateString('fr-FR', {day:'numeric',month:'short'});
}
function fmtFull(ts) {
  return new Date(ts).toLocaleDateString('fr-FR', {
    weekday:'long', day:'numeric', month:'long', year:'numeric',
    hour:'2-digit', minute:'2-digit'
  });
}

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let currentFolderId = null;
let currentSheetId = null;
let db = loadDB();

// ══════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function goBack(to) {
  if (to === 'sheets') {
    saveCurrentSheet();
    renderSheets();
    showScreen('sheets');
  } else {
    renderFolders();
    showScreen('folders');
  }
}

// ══════════════════════════════════════
// FOLDERS
// ══════════════════════════════════════
function renderFolders() {
  db = loadDB();
  const list = document.getElementById('folders-list');
  const meta = document.getElementById('folders-meta');
  meta.textContent = db.folders.length + ' dossier' + (db.folders.length !== 1 ? 's' : '');

  if (!db.folders.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📁</div>
      <div class="empty-text">Aucun dossier.<br>Créez-en un pour commencer.</div>
    </div>`;
    return;
  }

  list.innerHTML = db.folders.map(f => {
    const count = f.sheets ? f.sheets.length : 0;
    const last = f.sheets && f.sheets.length ? fmtDate(Math.max(...f.sheets.map(s=>s.updatedAt||s.createdAt))) : '';
    return `<div class="swipe-wrapper" id="fw-${f.id}">
      <div class="swipe-delete-bg">Supprimer</div>
      <div class="swipe-inner folder-item" onclick="openFolder('${f.id}')">
        <div class="folder-icon">${f.emoji || '📂'}</div>
        <div class="folder-info">
          <div class="folder-name">${esc(f.name)}</div>
          <div class="folder-meta">${count} terrain${count!==1?'s':''} ${last?'· '+last:''}</div>
        </div>
        <div class="folder-chevron">›</div>
      </div>
    </div>`;
  }).join('');

  db.folders.forEach(f => setupSwipe('fw-' + f.id, () => deleteFolder(f.id)));
}

function openFolder(id) {
  currentFolderId = id;
  renderSheets();
  showScreen('sheets');
}

function deleteFolder(id) {
  db.folders = db.folders.filter(f => f.id !== id);
  saveDB(db);
  renderFolders();
}

function openNewFolderModal() {
  document.getElementById('folder-name-input').value = '';
  document.getElementById('folder-emoji-input').value = '';
  document.getElementById('new-folder-modal').classList.add('open');
  setTimeout(() => document.getElementById('folder-name-input').focus(), 100);
}

function createFolder() {
  const name = document.getElementById('folder-name-input').value.trim();
  if (!name) return;
  const emoji = document.getElementById('folder-emoji-input').value.trim() || '📂';
  db.folders.push({ id: genId(), name, emoji, sheets: [], createdAt: Date.now() });
  saveDB(db);
  closeModal('new-folder-modal');
  renderFolders();
}

// ══════════════════════════════════════
// SHEETS
// ══════════════════════════════════════
function getFolder() { return db.folders.find(f => f.id === currentFolderId); }

function renderSheets() {
  db = loadDB();
  const folder = getFolder();
  if (!folder) return;
  document.getElementById('sheets-folder-name').textContent = folder.emoji + ' ' + folder.name;
  const sheets = folder.sheets || [];
  document.getElementById('sheets-meta').textContent = sheets.length + ' terrain' + (sheets.length!==1?'s':'');

  const list = document.getElementById('sheets-list');
  if (!sheets.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📋</div>
      <div class="empty-text">Aucun terrain dans ce dossier.<br>Créez votre première fiche.</div>
    </div>`;
    return;
  }

  const sorted = [...sheets].sort((a,b) => (b.updatedAt||b.createdAt) - (a.updatedAt||a.createdAt));
  list.innerHTML = sorted.map(s => {
    const preview = getSheetPreview(s);
    return `<div class="swipe-wrapper" id="sw-${s.id}">
      <div class="swipe-delete-bg">Supprimer</div>
      <div class="swipe-inner sheet-item" onclick="openSheet('${s.id}')">
        <div class="sheet-dot"></div>
        <div class="sheet-info">
          <div class="sheet-title">${esc(s.title)}</div>
          <div class="sheet-preview">${preview}</div>
        </div>
        <div class="sheet-date">${fmtDate(s.updatedAt||s.createdAt)}</div>
      </div>
    </div>`;
  }).join('');

  sorted.forEach(s => setupSwipe('sw-' + s.id, () => deleteSheet(s.id)));
}

function getSheetPreview(sheet) {
  if (!sheet.blocks || !sheet.blocks.length) return 'Fiche vide';
  for (const b of sheet.blocks) {
    if (b.type === 'text' && b.content && b.content.trim()) return esc(b.content.slice(0,60));
    if (b.type === 'audio') return '🎙 Enregistrement vocal';
    if (b.type === 'photo-series') return `📷 ${b.photos ? b.photos.length : 1} photo${b.photos && b.photos.length > 1 ? 's' : ''}`;
    if (b.type === 'drawing') return '✏️ Schéma';
  }
  return 'Fiche vide';
}

function openSheet(id) {
  currentSheetId = id;
  const folder = getFolder();
  const sheet = folder.sheets.find(s => s.id === id);
  document.getElementById('editor-title').value = sheet.title;
  document.getElementById('editor-meta').textContent = fmtFull(sheet.createdAt);
  renderBlocks(sheet.blocks || []);
  showScreen('editor');
  document.getElementById('editor-input').focus();
}

function deleteSheet(id) {
  const folder = getFolder();
  folder.sheets = folder.sheets.filter(s => s.id !== id);
  saveDB(db);
  renderSheets();
}

function openNewSheetModal() {
  const d = new Date();
  const suggested = d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  document.getElementById('sheet-name-input').value = suggested;
  document.getElementById('new-sheet-modal').classList.add('open');
  setTimeout(() => {
    const inp = document.getElementById('sheet-name-input');
    inp.focus(); inp.select();
  }, 100);
}

function createSheet() {
  const title = document.getElementById('sheet-name-input').value.trim();
  if (!title) return;
  const folder = getFolder();
  const sheet = { id: genId(), title, blocks: [], createdAt: Date.now(), updatedAt: Date.now() };
  folder.sheets.push(sheet);
  saveDB(db);
  closeModal('new-sheet-modal');
  openSheet(sheet.id);
}

function saveCurrentSheet() {
  const folder = getFolder();
  if (!folder || !currentSheetId) return;
  const sheet = folder.sheets.find(s => s.id === currentSheetId);
  if (!sheet) return;
  sheet.title = document.getElementById('editor-title').value.trim() || sheet.title;
  sheet.updatedAt = Date.now();
  saveDB(db);
}

// ══════════════════════════════════════
// BLOCKS
// ══════════════════════════════════════
function getSheet() {
  const folder = getFolder();
  return folder ? folder.sheets.find(s => s.id === currentSheetId) : null;
}

function addBlock(block) {
  const sheet = getSheet();
  if (!sheet) return;
  sheet.blocks.push(block);
  sheet.updatedAt = Date.now();
  saveDB(db);
  renderBlocks(sheet.blocks);
  setTimeout(() => {
    const ca = document.getElementById('content-area');
    ca.scrollTop = ca.scrollHeight;
  }, 50);
}

function deleteBlock(blockId) {
  const sheet = getSheet();
  if (!sheet) return;
  sheet.blocks = sheet.blocks.filter(b => b.id !== blockId);
  sheet.updatedAt = Date.now();
  saveDB(db);
  renderBlocks(sheet.blocks);
}

function renderBlocks(blocks) {
  const area = document.getElementById('content-area');
  if (!blocks.length) {
    area.innerHTML = `<div class="block"><div class="block-text empty" data-placeholder="Commencez à écrire…"></div></div>`;
    return;
  }
  area.innerHTML = blocks.map(b => renderBlock(b)).join('');
  // bind audio
  blocks.filter(b=>b.type==='audio').forEach(b => bindAudio(b));
}

function renderBlock(b) {
  const id = b.id;
  if (b.type === 'text') {
    return `<div class="block"><div class="block-text">${esc(b.content)}</div></div>`;
  }
  if (b.type === 'photo-series') {
    const photos = b.photos || [];
    const count = photos.length;
    const MAX_SHOW = 9;
    const shown = photos.slice(0, MAX_SHOW);
    const thumbs = shown.map((p, i) => {
      const isLast = i === MAX_SHOW - 1 && count > MAX_SHOW;
      return `<div class="photo-thumb" onclick="openLightbox('${id}', ${i})">
        <img src="${p.thumb}" alt="Photo ${i+1}">
        ${isLast ? `<div class="photo-thumb-count">+${count - MAX_SHOW + 1}</div>` : ''}
      </div>`;
    }).join('');
    return `<div class="block-photo-series">
      <div class="photo-series-label">
        <span>📷 ${count} photo${count>1?'s':''}</span>
        <button class="photo-series-delete" onclick="deleteBlock('${id}')">Supprimer</button>
      </div>
      <div class="photo-grid">${thumbs}</div>
    </div>`;
  }
  if (b.type === 'drawing') {
    return `<div class="block-media">
      <img src="${b.data}" alt="Schéma">
      <div class="block-media-label">✏️ Schéma</div>
      <button class="block-delete" onclick="deleteBlock('${id}')">✕</button>
    </div>`;
  }
  if (b.type === 'audio') {
    const bars = Array(20).fill(0).map((_,i) => {
      const h = 4 + Math.random()*20;
      return `<div class="audio-bar" style="height:${h}px" data-idx="${i}"></div>`;
    }).join('');
    return `<div class="block-audio" id="audio-${id}">
      <button class="audio-play" onclick="playAudio('${id}')">
        <svg id="play-icon-${id}" width="14" height="14" fill="#0f0f0f" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="audio-info">
        <div class="audio-name">🎙 Enregistrement vocal</div>
        <div class="audio-dur" id="dur-${id}">${b.duration ? fmtDur(b.duration) : ''}</div>
        <div class="audio-waveform" id="wave-${id}">${bars}</div>
      </div>
      <button class="block-delete" onclick="deleteBlock('${id}')">✕</button>
    </div>`;
  }
  return '';
}

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtDur(s) {
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return m + ':' + String(sec).padStart(2,'0');
}

// ══════════════════════════════════════
// TEXT INPUT
// ══════════════════════════════════════
document.getElementById('editor-input').addEventListener('input', function() {
  document.getElementById('send-btn').disabled = !this.value.trim();
});
document.getElementById('editor-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
});

function sendText() {
  const inp = document.getElementById('editor-input');
  const text = inp.value.trim();
  if (!text) return;
  addBlock({ id: genId(), type: 'text', content: text, ts: Date.now() });
  inp.value = '';
  inp.style.height = '';
  document.getElementById('send-btn').disabled = true;
}

function autoResize(el) {
  el.style.height = '';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ══════════════════════════════════════
// AUDIO RECORDING
// ══════════════════════════════════════
let mediaRecorder = null;
let audioChunks = [];
let recStart = 0;
let recTimer = null;

async function toggleRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    stopRecording();
  } else {
    startRecording();
  }
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    recStart = Date.now();
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = finalizeAudio;
    mediaRecorder.start();

    document.getElementById('mic-btn').classList.add('recording');
    document.getElementById('rec-indicator').classList.add('visible');
    recTimer = setInterval(() => {
      const s = Math.floor((Date.now()-recStart)/1000);
      document.getElementById('rec-time').textContent = fmtDur(s);
    }, 500);
  } catch(e) {
    alert('Microphone non autorisé. Vérifiez les permissions dans Réglages > Safari.');
  }
}

function stopRecording() {
  if (mediaRecorder) { mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(t=>t.stop()); }
  document.getElementById('mic-btn').classList.remove('recording');
  document.getElementById('rec-indicator').classList.remove('visible');
  clearInterval(recTimer);
}

function finalizeAudio() {
  const blob = new Blob(audioChunks, { type: 'audio/webm' });
  const duration = (Date.now() - recStart) / 1000;
  const reader = new FileReader();
  reader.onload = () => {
    addBlock({ id: genId(), type: 'audio', data: reader.result, duration, ts: Date.now() });
  };
  reader.readAsDataURL(blob);
}

const audioPlayers = {};
function bindAudio(b) { /* players are created on demand */ }

function playAudio(id) {
  const sheet = getSheet();
  const block = sheet.blocks.find(b=>b.id===id);
  if (!block) return;

  if (audioPlayers[id]) {
    const player = audioPlayers[id];
    if (player.paused) {
      player.play();
      setPlayIcon(id, true);
    } else {
      player.pause();
      setPlayIcon(id, false);
    }
    return;
  }
  const audio = new Audio(block.data);
  audioPlayers[id] = audio;
  audio.play();
  setPlayIcon(id, true);

  const wave = document.getElementById('wave-' + id);
  const bars = wave ? wave.querySelectorAll('.audio-bar') : [];
  audio.ontimeupdate = () => {
    const pct = audio.duration ? audio.currentTime / audio.duration : 0;
    bars.forEach((bar, i) => {
      bar.classList.toggle('played', i / bars.length < pct);
    });
    const durEl = document.getElementById('dur-' + id);
    if (durEl) durEl.textContent = fmtDur(audio.currentTime) + ' / ' + fmtDur(audio.duration||0);
  };
  audio.onended = () => { setPlayIcon(id, false); bars.forEach(b=>b.classList.remove('played')); };
}

function setPlayIcon(id, playing) {
  const icon = document.getElementById('play-icon-' + id);
  if (!icon) return;
  icon.innerHTML = playing
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

// ══════════════════════════════════════
// CAMERA / PHOTO
// ══════════════════════════════════════
let photoSession = []; // accumulates photos during a session

function togglePhotoMenu() {
  const menu = document.getElementById('photo-menu');
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}

function startCameraSession() {
  document.getElementById('photo-menu').style.display = 'none';
  photoSession = [];
  document.getElementById('camera-input').click();
}

function openGallery() {
  document.getElementById('photo-menu').style.display = 'none';
  document.getElementById('gallery-input').click();
}

// Close photo menu on outside tap
document.addEventListener('click', e => {
  const menu = document.getElementById('photo-menu');
  const btn = document.getElementById('photo-btn');
  if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
    menu.style.display = 'none';
  }
});

async function handleCameraCapture(files) {
  if (!files || !files.length) {
    // User cancelled — if we already have photos, insert them
    if (photoSession.length > 0) finishPhotoSession();
    return;
  }

  const processed = await processImageFile(files[0]);
  photoSession.push({ full: processed.full, thumb: processed.thumb });

  // Show inline prompt: continue or finish
  showPhotoContinuePrompt();
}

function showPhotoContinuePrompt() {
  // Remove any existing prompt
  const existing = document.getElementById('photo-prompt');
  if (existing) existing.remove();

  const count = photoSession.length;
  const prompt = document.createElement('div');
  prompt.id = 'photo-prompt';
  prompt.style.cssText = `
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
    background: var(--bg2); border-top: 1px solid var(--border);
    padding: 16px 20px; padding-bottom: calc(16px + var(--safe-bottom));
    display: flex; flex-direction: column; gap: 10px;
  `;
  prompt.innerHTML = `
    <div style="font-size:13px;color:var(--text2);text-align:center">
      ${count} photo${count > 1 ? 's' : ''} prise${count > 1 ? 's' : ''}
    </div>
    <div style="display:flex;gap:10px">
      <button onclick="continuePhotoSession()" style="
        flex:1; padding:13px; border-radius:12px; border:none;
        background:var(--bg3); color:var(--text); font-size:15px;
        font-family:inherit; cursor:pointer; font-weight:500;
      ">📷 Encore une</button>
      <button onclick="finishPhotoSession()" style="
        flex:1; padding:13px; border-radius:12px; border:none;
        background:var(--accent); color:#0f0f0f; font-size:15px;
        font-family:inherit; cursor:pointer; font-weight:600;
      ">Insérer (${count})</button>
    </div>
  `;
  document.body.appendChild(prompt);
}

function continuePhotoSession() {
  const prompt = document.getElementById('photo-prompt');
  if (prompt) prompt.remove();
  document.getElementById('camera-input').click();
}

function finishPhotoSession() {
  const prompt = document.getElementById('photo-prompt');
  if (prompt) prompt.remove();
  if (!photoSession.length) return;
  addBlock({
    id: genId(),
    type: 'photo-series',
    photos: [...photoSession],
    ts: Date.now()
  });
  photoSession = [];
}

document.getElementById('camera-input').addEventListener('change', function() {
  handleCameraCapture(this.files); this.value='';
});
document.getElementById('gallery-input').addEventListener('change', function() {
  handleImageFiles(this.files); this.value='';
});

async function handleImageFiles(files) {
  if (!files || !files.length) return;
  const processed = await Promise.all(Array.from(files).map(processImageFile));
  addBlock({
    id: genId(),
    type: 'photo-series',
    photos: processed.map(p => ({ full: p.full, thumb: p.thumb })),
    ts: Date.now()
  });
}

function processImageFile(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        // Full quality version (max 2400px, JPEG 95%)
        const fullCanvas = document.createElement('canvas');
        const maxFull = 2400;
        let fw = img.width, fh = img.height;
        if (fw > maxFull) { fh = fh * maxFull/fw; fw = maxFull; }
        if (fh > maxFull) { fw = fw * maxFull/fh; fh = maxFull; }
        fullCanvas.width = fw; fullCanvas.height = fh;
        fullCanvas.getContext('2d').drawImage(img, 0, 0, fw, fh);
        const fullData = fullCanvas.toDataURL('image/jpeg', 0.95);

        // Thumbnail (200px, JPEG 80%)
        const thumbCanvas = document.createElement('canvas');
        const maxThumb = 200;
        let tw = img.width, th = img.height;
        if (tw > maxThumb) { th = th * maxThumb/tw; tw = maxThumb; }
        if (th > maxThumb) { tw = tw * maxThumb/th; th = maxThumb; }
        thumbCanvas.width = tw; thumbCanvas.height = th;
        thumbCanvas.getContext('2d').drawImage(img, 0, 0, tw, th);
        const thumbData = thumbCanvas.toDataURL('image/jpeg', 0.8);

        resolve({ full: fullData, thumb: thumbData });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── LIGHTBOX ──
let lbBlockId = null;
let lbIndex = 0;
let lbPhotos = [];

function openLightbox(blockId, index) {
  const sheet = getSheet();
  const block = sheet.blocks.find(b => b.id === blockId);
  if (!block) return;
  lbBlockId = blockId;
  lbPhotos = block.photos || [];
  lbIndex = index;
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');

  // Swipe support
  setupLightboxSwipe();
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  lbPhotos = []; lbBlockId = null;
}

function renderLightbox() {
  document.getElementById('lb-img').src = lbPhotos[lbIndex].full;
  document.getElementById('lb-counter').textContent = (lbIndex+1) + ' / ' + lbPhotos.length;
  document.getElementById('lb-prev').disabled = lbIndex === 0;
  document.getElementById('lb-next').disabled = lbIndex === lbPhotos.length - 1;

  // dots (only show if ≤ 12)
  const dotsEl = document.getElementById('lb-dots');
  if (lbPhotos.length > 1 && lbPhotos.length <= 12) {
    dotsEl.innerHTML = lbPhotos.map((_,i) =>
      `<div class="lightbox-dot ${i===lbIndex?'active':''}"></div>`
    ).join('');
  } else {
    dotsEl.innerHTML = '';
  }
}

function lbNav(dir) {
  lbIndex = Math.max(0, Math.min(lbPhotos.length-1, lbIndex + dir));
  renderLightbox();
}

function downloadCurrentPhoto() {
  const photo = lbPhotos[lbIndex];
  if (!photo) return;
  const a = document.createElement('a');
  a.href = photo.full;
  a.download = 'terrain-photo-' + (lbIndex+1) + '.jpg';
  a.click();
}

function setupLightboxSwipe() {
  const wrap = document.getElementById('lightbox');
  let sx = 0;
  wrap.ontouchstart = e => { sx = e.touches[0].clientX; };
  wrap.ontouchend = e => {
    const dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 50) lbNav(dx < 0 ? 1 : -1);
  };
}

// keyboard nav
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'ArrowRight') lbNav(1);
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'Escape') closeLightbox();
});

// ══════════════════════════════════════
// DRAWING
// ══════════════════════════════════════
let drawColor = '#f0ede8';
let drawSize = 3;
let drawErasing = false;
let isDrawing = false;
let lastX = 0, lastY = 0;

function openDrawModal() {
  const modal = document.getElementById('draw-modal');
  modal.classList.add('open');
  initCanvas();
}

function closeDrawModal() {
  document.getElementById('draw-modal').classList.remove('open');
}

function initCanvas() {
  const canvas = document.getElementById('draw-canvas');
  const wrap = canvas.parentElement;
  const h = Math.min(window.innerHeight * 0.5, 400);
  canvas.width = wrap.clientWidth;
  canvas.height = h;
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function clearCanvas() {
  const canvas = document.getElementById('draw-canvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function setColor(c, el) {
  drawColor = c; drawErasing = false;
  document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('erase-btn').classList.remove('active');
}

function setSize(s, el) {
  drawSize = s;
  document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}

function toggleErase() {
  drawErasing = !drawErasing;
  document.getElementById('erase-btn').classList.toggle('active', drawErasing);
  document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
}

function getPos(e, canvas) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return [(src.clientX - rect.left) * scaleX, (src.clientY - rect.top) * scaleY];
}

const canvas = document.getElementById('draw-canvas');
canvas.addEventListener('mousedown', e => { isDrawing=true; [lastX,lastY]=getPos(e,canvas); });
canvas.addEventListener('mousemove', e => { if(!isDrawing) return; draw(e); });
canvas.addEventListener('mouseup', () => isDrawing=false);
canvas.addEventListener('touchstart', e => { e.preventDefault(); isDrawing=true; [lastX,lastY]=getPos(e,canvas); }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); if(!isDrawing) return; draw(e); }, {passive:false});
canvas.addEventListener('touchend', () => isDrawing=false);

function draw(e) {
  const ctx = canvas.getContext('2d');
  const [x, y] = getPos(e, canvas);
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(x, y);
  ctx.strokeStyle = drawErasing ? '#1a1a1a' : drawColor;
  ctx.lineWidth = drawErasing ? drawSize*4 : drawSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
  [lastX, lastY] = [x, y];
}

function confirmDraw() {
  const data = canvas.toDataURL('image/png');
  addBlock({ id: genId(), type: 'drawing', data, ts: Date.now() });
  closeDrawModal();
  clearCanvas();
}

// ══════════════════════════════════════
// SWIPE TO DELETE
// ══════════════════════════════════════
function setupSwipe(wrapperId, onDelete) {
  const wrapper = document.getElementById(wrapperId);
  if (!wrapper) return;
  const inner = wrapper.querySelector('.swipe-inner');
  let startX = 0, dx = 0, swiping = false;

  inner.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX; dx = 0; swiping = true;
  }, {passive:true});

  inner.addEventListener('touchmove', e => {
    if (!swiping) return;
    dx = e.touches[0].clientX - startX;
    if (dx > 0) dx = 0;
    if (dx < -100) dx = -100;
    inner.style.transform = `translateX(${dx}px)`;
  }, {passive:true});

  inner.addEventListener('touchend', () => {
    swiping = false;
    if (dx < -70) {
      inner.style.transform = 'translateX(-80px)';
      wrapper.querySelector('.swipe-delete-bg').style.pointerEvents = 'all';
      wrapper.querySelector('.swipe-delete-bg').onclick = () => {
        inner.style.transition = 'transform 0.2s, opacity 0.2s';
        inner.style.transform = 'translateX(-100%)';
        inner.style.opacity = '0';
        setTimeout(onDelete, 200);
      };
    } else {
      inner.style.transition = 'transform 0.2s';
      inner.style.transform = '';
      setTimeout(() => inner.style.transition='', 200);
    }
  });
}
